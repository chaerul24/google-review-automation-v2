<!DOCTYPE html>
<html>
<head>
<style>
body { background: #f8fafc; font-family: sans-serif; padding: 20px; }
.container { display: flex; gap: 20px; justify-content: center; }
.card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); width: 220px; }
img { height: 120px; object-fit: contain; }
h3 { font-size: 14px; margin-top: 10px; color: #1e293b; }
</style>
</head>
<body>
<div class='container'>
  <div class='card'><img src='claude_mascot_control.png' /><h3>Control Terminal</h3></div>
  <div class='card'><img src='claude_mascot_server.png' /><h3>Server Multi-Screen</h3></div>
  <div class='card'><img src='claude_mascot_hero.png' /><h3>Claude Hero</h3></div>
  <div class='card'><img src='claude_mascot_inspect.png' /><h3>Inspect Magnifier</h3></div>
</div>
</body>
</html>
